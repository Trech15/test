name: capstone
description: A stress management chatbot app for campus stress management and support.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0

  # Speech & Audio
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5

  # Networking
  http: ^1.6.0

  # Backend
  supabase_flutter: ^2.3.4

  # Google sign-in
  google_sign_in: ^6.2.1

  # Storage
  shared_preferences: ^2.2.2

  # UI & Utilities
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.0
  provider: ^6.0.0
  percent_indicator: ^4.0.0

  # Voice assistant (LiveKit)
  livekit_client: ^2.13.0

  # Permissions & Media
  permission_handler: ^12.0.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # App Launcher Icon
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Makes app_logo.png (and anything else in this folder) available to Image.asset
  assets:
    - assets/images/

# ChaTress App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21